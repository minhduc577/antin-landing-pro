<!-- Container Tổng Quan Tiến Độ Công Trình An Tín AI -->
<div class="relative bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900 text-white p-6 rounded-3xl shadow-2xl border border-blue-500/30 overflow-hidden">
  
  <!-- Hiệu ứng ánh sáng nền động -->
  <div class="absolute -top-24 -right-24 w-72 h-72 bg-cyan-500/20 rounded-full blur-3xl animate-pulse"></div>

  <!-- Header: Tiêu đề & Trạng thái AI -->
  <div class="flex justify-between items-center mb-6">
    <div>
      <span class="px-3 py-1 bg-cyan-500/20 text-cyan-400 text-xs font-semibold rounded-full border border-cyan-500/40 flex items-center gap-1 w-fit mb-2">
        ✨ An Tín AI Engine v3.0
      </span>
      <h2 class="text-2xl font-bold tracking-wide">Biệt Thự nghỉ dưỡng - Imperia</h2>
    </div>
    <div class="text-right">
      <span class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-emerald-400">78%</span>
      <p class="text-xs text-gray-400">Tiến độ tổng thể</p>
    </div>
  </div>

  <!-- Thanh Tiến Độ Sóng Động (Animated Progress Bar) -->
  <div class="mb-6">
    <div class="flex justify-between text-sm mb-2 text-gray-300">
      <span>Khởi công: 12/01/2026</span>
      <span class="text-emerald-400 font-medium">Đang nhanh hơn 3 ngày 🚀</span>
    </div>
    <div class="w-full bg-slate-800 h-4 rounded-full overflow-hidden p-0.5 border border-slate-700">
      <div class="bg-gradient-to-r from-blue-500 via-cyan-400 to-emerald-400 h-full rounded-full transition-all duration-1000 relative shadow-[0_0_15px_rgba(6,182,212,0.6)]" style="width: 78%;">
        <div class="absolute inset-0 bg-white/20 animate-[shimmer_2s_infinite]"></div>
      </div>
    </div>
  </div>

  <!-- Danh sách hạng mục con (Grid Card) -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
    <div class="bg-slate-800/60 backdrop-blur-md p-4 rounded-2xl border border-slate-700/60 hover:border-cyan-500/50 transition-all">
      <div class="flex items-center gap-3 mb-2">
        <span class="p-2 bg-blue-500/20 rounded-xl text-blue-400">🧱</span>
        <h4 class="font-semibold">Phần Thô & Móng</h4>
      </div>
      <p class="text-sm text-emerald-400 font-medium">✓ Đã hoàn thành 100%</p>
    </div>
    
    <div class="bg-slate-800/60 backdrop-blur-md p-4 rounded-2xl border border-slate-700/60 hover:border-cyan-500/50 transition-all">
      <div class="flex items-center gap-3 mb-2">
        <span class="p-2 bg-yellow-500/20 rounded-xl text-yellow-400">⚡</span>
        <h4 class="font-semibold">Hệ thống Điện Nước</h4>
      </div>
      <p class="text-sm text-cyan-400 font-medium">⚡ Đang thi công (65%)</p>
    </div>

    <div class="bg-slate-800/60 backdrop-blur-md p-4 rounded-2xl border border-slate-700/60 hover:border-cyan-500/50 transition-all">
      <div class="flex items-center gap-3 mb-2">
        <span class="p-2 bg-purple-500/20 rounded-xl text-purple-400">🛋️</span>
        <h4 class="font-semibold">Nội thất AI Design</h4>
      </div>
      <p class="text-sm text-gray-400 font-medium">⏳ Sắp khởi công</p>
    </div>
  </div>

  <!-- Khu vực Nút Nhấn Tích Hợp AI - Kích Thích Hành Động -->
  <div class="flex flex-col sm:flex-row gap-3">
    <button class="flex-1 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold py-3.5 px-6 rounded-2xl shadow-[0_4px_20px_rgba(6,182,212,0.4)] transition-all transform hover:-translate-y-0.5 flex items-center justify-center gap-2 cursor-pointer">
      <span>📹</span> Xem Camera Trực Tiếp & Time-Lapse
    </button>
    
    <button class="flex-1 bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-cyan-500/40 font-bold py-3.5 px-6 rounded-2xl transition-all flex items-center justify-center gap-2 cursor-pointer shadow-lg">
      <span>🤖</span> Hỏi Trợ Lý An Tín AI
    </button>
  </div>

</div>
